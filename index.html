  <script>
    const { useState, useEffect, useMemo, createElement: h } = React;

    const GRADES = ["S", "A", "B", "C", "D"];
    const GRADE_POINTS = { S: 10, A: 8, B: 6, C: 4, D: 2 };
    const pointsFor = (g) => (g ? GRADE_POINTS[g] || 0 : 0);

    const GRADE_TARGET_RATE = { S: 5, A: 15, B: 65, C: 10, D: 5 };
    const recommendedCount = (n, g) => (Math.round(n * (GRADE_TARGET_RATE[g] / 100) * 10) / 10).toFixed(1);

    const DEPARTMENTS = ["관리팀", "영업팀", "생산관리팀", "생산팀"];
    const POSITIONS = ["사장", "부사장", "전무", "상무", "이사", "실장", "부장", "차장", "과장", "대리", "주임", "사원"];
    const STATUS_LIST = ["재직", "퇴사", "휴직"];

    const EXEC = { competency: 0, performance: 0.8, selfDev: 0.1, mentoring: 0.1 };
    const SENIOR = { competency: 0.3, performance: 0.6, selfDev: 0.1, mentoring: 0 };
    const MID = { competency: 0.6, performance: 0.4, selfDev: 0, mentoring: 0 };
    const JUNIOR = { competency: 0.7, performance: 0.3, selfDev: 0, mentoring: 0 };

    function weightsFor(position) {
      if (["사장", "부사장", "전무", "상무", "이사"].includes(position)) return EXEC;
      if (["실장", "부장", "차장"].includes(position)) return SENIOR;
      if (["과장", "대리"].includes(position)) return MID;
      return JUNIOR;
    }

    function finalScore(position, ev) {
      const w = weightsFor(position);
      const n = (v) => (v === "" || v === null || isNaN(v) ? 0 : parseFloat(v));
      const sum = (n(ev.competency) * w.competency) +
                  (n(ev.performance) * w.performance) +
                  (n(ev.selfDev) * w.selfDev) +
                  (n(ev.mentoring) * w.mentoring);
      return Math.round((sum + n(ev.adjust)) * 10) / 10;
    }

    // 2025.12.31 기준 28명 기본 스냅샷 마스터

      { snapshot_year: 2025, emp_no: "DS-2003", name: "김영진", dept: "영업팀", position: "부장", birth_date: "1972-10-19", hire_date: "2014-09-01", promo_date: "2021-09-01", retire_date: "", status: "재직", remarks: "신규수주" },
      { snapshot_year: 2025, emp_no: "DS-2004", name: "우국진", dept: "영업팀", position: "차장", birth_date: "1983-09-21", hire_date: "2009-08-24", promo_date: "2022-03-01", retire_date: "", status: "재직", remarks: "특수강" },
      { snapshot_year: 2025, emp_no: "DS-2005", name: "김영민", dept: "영업팀", position: "차장", birth_date: "1984-01-25", hire_date: "2007-12-01", promo_date: "2022-09-01", retire_date: "", status: "재직", remarks: "지방영업" },
      { snapshot_year: 2025, emp_no: "DS-2006", name: "박성진", dept: "영업팀", position: "과장", birth_date: "1983-12-11", hire_date: "2022-04-01", promo_date: "2022-03-01", retire_date: "", status: "재직", remarks: "여신채권" },
      { snapshot_year: 2025, emp_no: "DS-2007", name: "김영수", dept: "영업팀", position: "과장", birth_date: "1984-07-19", hire_date: "2018-04-16", promo_date: "2024-01-01", retire_date: "", status: "재직", remarks: "수주견적" },

      { snapshot_year: 2025, emp_no: "DS-3003", name: "송병섭", dept: "생산관리팀", position: "대리", birth_date: "1994-06-21", hire_date: "2022-06-01", promo_date: "2024-01-01", retire_date: "", status: "재직", remarks: "납기관리" },
      { snapshot_year: 2025, emp_no: "DS-4001", name: "조원일", dept: "생산팀", position: "부장", birth_date: "1980-07-28", hire_date: "2001-08-16", promo_date: "2024-01-01", retire_date: "", status: "재직", remarks: "생산총괄" },
      { snapshot_year: 2025, emp_no: "DS-4002", name: "서재천", dept: "생산팀", position: "차장", birth_date: "1982-02-12", hire_date: "2008-09-01", promo_date: "2023-01-01", retire_date: "", status: "재직", remarks: "1공장가동" },
      { snapshot_year: 2025, emp_no: "DS-4003", name: "문정식", dept: "생산팀", position: "차장", birth_date: "1983-02-09", hire_date: "2010-09-01", promo_date: "2025-01-01", retire_date: "", status: "재직", remarks: "2공장설비" },
      { snapshot_year: 2025, emp_no: "DS-4004", name: "정태현", dept: "생산팀", position: "과장", birth_date: "1981-06-15", hire_date: "2011-09-01", promo_date: "2024-01-01", retire_date: "", status: "재직", remarks: "슬리팅가공" },
      { snapshot_year: 2025, emp_no: "DS-4005", name: "안상호", dept: "생산팀", position: "과장", birth_date: "1981-12-07", hire_date: "2013-03-01", promo_date: "2024-01-01", retire_date: "", status: "재직", remarks: "쉬어라인" },
      { snapshot_year: 2025, emp_no: "DS-4006", name: "송성민", dept: "생산팀", position: "과장", birth_date: "1985-05-24", hire_date: "2015-03-09", promo_date: "2024-01-01", retire_date: "", status: "재직", remarks: "품질검사" },
      { snapshot_year: 2025, emp_no: "DS-4007", name: "김동훈", dept: "생산팀", position: "과장", birth_date: "1985-08-15", hire_date: "2017-01-02", promo_date: "2024-01-01", retire_date: "", status: "재직", remarks: "현장관리" },
      { snapshot_year: 2025, emp_no: "DS-4008", name: "김영호", dept: "생산팀", position: "과장", birth_date: "1987-10-18", hire_date: "2017-08-01", promo_date: "2025-01-01", retire_date: "", status: "재직", remarks: "설비보전" },
      { snapshot_year: 2025, emp_no: "DS-4009", name: "문태환", dept: "생산팀", position: "과장", birth_date: "1987-03-04", hire_date: "2018-09-17", promo_date: "2025-01-01", retire_date: "", status: "재직", remarks: "오퍼레이팅" },
      { snapshot_year: 2025, emp_no: "DS-4010", name: "장민석", dept: "생산팀", position: "대리", birth_date: "1994-06-03", hire_date: "2021-06-01", promo_date: "2024-01-01", retire_date: "", status: "재직", remarks: "포장결속" },
      { snapshot_year: 2025, emp_no: "DS-4011", name: "김형진", dept: "생산팀", position: "주임", birth_date: "1994-07-28", hire_date: "2023-04-01", promo_date: "2025-01-01", retire_date: "", status: "재직", remarks: "자재운반" },
      { snapshot_year: 2025, emp_no: "DS-4012", name: "이현규", dept: "생산팀", position: "사원", birth_date: "1998-03-10", hire_date: "2023-12-01", promo_date: "2023-12-01", retire_date: "", status: "재직", remarks: "현장보조" }
    ];

    function App() {
      const [sbConfig, setSbConfig] = useState(() => ({
        url: localStorage.getItem("ds_sb_url") || "",
        key: localStorage.getItem("ds_sb_key") || ""
      }));
      const [supabaseClient, setSupabaseClient] = useState(null);
      const [isConfigOpen, setIsConfigOpen] = useState(false);
      const [isWeightGuideOpen, setIsWeightGuideOpen] = useState(false);

      const [year, setYear] = useState(2025);
      const [dept, setDept] = useState("전체");
      const [tab, setTab] = useState("input"); // 'input' | 'promo' | 'snapshot_master'
      const [searchQuery, setSearchQuery] = useState("");
      const [includeRetired, setIncludeRetired] = useState(false);

      // 연도별 사원 스냅샷 저장소: { [year]: [ 사원1, 사원2, ... ] }
      const [snapshotStore, setSnapshotStore] = useState(() => {
        const saved = localStorage.getItem("ds_snapshot_store_v1");
        if (saved) {
          try { return JSON.parse(saved); } catch(e){}
        }
        return { 2025: DEFAULT_SNAPSHOT_2025 };
      });

      // 10개년 인사평가 원장 저장소: { [year]: { [emp_no]: evalData } }
      const [evalStore, setEvalStore] = useState(() => {
        const saved = localStorage.getItem("ds_eval_store_v10");
        return saved ? JSON.parse(saved) : {};
      });

      // Supabase 초기화
      useEffect(() => {
        if (sbConfig.url && sbConfig.key && window.supabase) {
          try {
            setSupabaseClient(window.supabase.createClient(sbConfig.url, sbConfig.key));
          } catch(e) {}
        }
      }, [sbConfig]);

      // Supabase와 연도별 사원 스냅샷 및 평가 데이터 실시간 동기화
      useEffect(() => {
        if (!supabaseClient) return;

        // 1. 해당 연도 12.31 스냅샷 사원마스터 로드
        supabaseClient.from("employee_snapshots")
          .select("*")
          .eq("snapshot_year", year)
          .order("emp_no")
          .then(({ data, error }) => {
            if (!error && data && data.length > 0) {
              setSnapshotStore(prev => ({ ...prev, [year]: data }));
            } else if (data && data.length === 0 && year === 2025) {
              // 2025년 초기 데이터 업로드
              supabaseClient.from("employee_snapshots").upsert(DEFAULT_SNAPSHOT_2025).then(() => {});
            }
          });

        // 2. 해당 연도 평가 데이터 로드 (과거 10년 치 보존 원장)
        supabaseClient.from("annual_evaluations")
          .select("*")
          .eq("eval_year", year)
          .then(({ data, error }) => {
            if (!error && data && data.length > 0) {
              const loaded = {};
              data.forEach(r => {
                loaded[r.emp_no] = {
                  competency: r.comp_score !== null ? r.comp_score : "",
                  performance: r.perf_score !== null ? r.perf_score : "",
                  selfDev: r.self_dev_score !== null ? r.self_dev_score : "",
                  mentoring: r.leadership_score !== null ? r.leadership_score : "",
                  adjust: r.adj_score !== null ? r.adj_score : "",
                  adjustReason: r.adj_reason || "",
                  grade: r.final_grade || "",
                  note: r.remarks || ""
                };
              });
              setEvalStore(prev => ({ ...prev, [year]: loaded }));
            }
          });
      }, [supabaseClient, year]);

      // 브라우저 캐시 동기화
      useEffect(() => {
        localStorage.setItem("ds_snapshot_store_v1", JSON.stringify(snapshotStore));
      }, [snapshotStore]);

      useEffect(() => {
        localStorage.setItem("ds_eval_store_v10", JSON.stringify(evalStore));
      }, [evalStore]);

      // 현재 선택 연도의 사원 스냅샷 목록
      const currentYearEmployees = useMemo(() => {
        return snapshotStore[year] || [];
      }, [snapshotStore, year]);

      // 화면에 표시할 사원 필터링 (부서, 검색어, 퇴사자 포함 여부)
      const filteredEmps = useMemo(() => {
        return currentYearEmployees.filter(e => {
          const matchDept = dept === "전체" || e.dept === dept;
          const matchStatus = includeRetired ? true : (e.status === "재직");
          const matchSearch = searchQuery === "" ||
            (e.name && e.name.includes(searchQuery)) ||
            (e.emp_no && e.emp_no.includes(searchQuery)) ||
            (e.position && e.position.includes(searchQuery));
          return matchDept && matchStatus && matchSearch;
        });
      }, [currentYearEmployees, dept, searchQuery, includeRetired]);

      // 등급별 실시간 카운트
      const currentYearEvals = evalStore[year] || {};
      const counts = useMemo(() => {
        const c = { S: 0, A: 0, B: 0, C: 0, D: 0 };
        filteredEmps.forEach(e => {
          const g = currentYearEvals[e.emp_no]?.grade;
          if (g && c[g] !== undefined) c[g]++;
        });
        return c;
      }, [filteredEmps, currentYearEvals]);

      const totalCount = filteredEmps.length;
      const gradedTotal = GRADES.reduce((s, g) => s + counts[g], 0);
      const getPct = (c) => (totalCount > 0 ? Math.round((c / totalCount) * 1000) / 10 : 0);

      // --- 핸들러 함수들 ---

      // 평가 점수 입력 핸들러
      const handleCellChange = (empNo, field, value) => {
        setEvalStore(prev => {
          const yData = prev[year] || {};
          const empEval = yData[empNo] || { competency: "", performance: "", selfDev: "", mentoring: "", adjust: "", adjustReason: "", grade: "", note: "" };
          const updatedEval = { ...empEval, [field]: value };
          return { ...prev, [year]: { ...yData, [empNo]: updatedEval } };
        });
      };

      // 사원마스터 엑셀 그리드 셀 수정
      const handleSnapshotCellChange = (empNo, field, value) => {
        setSnapshotStore(prev => {
          const list = prev[year] || [];
          const updated = list.map(e => e.emp_no === empNo ? { ...e, [field]: value } : e);
          return { ...prev, [year]: updated };
        });
      };

      // 사원마스터 행 추가
      const handleAddRow = () => {
        const newNo = "DS-" + (1000 + (currentYearEmployees.length + 1));
        const newEmp = {
          snapshot_year: year,
          emp_no: newNo,
          name: "신규사원",
          dept: "관리팀",
          position: "사원",
          birth_date: "",
          hire_date: `${year}-01-01`,
          promo_date: `${year}-01-01`,
          retire_date: "",
          status: "재직",
          remarks: ""
        };
        setSnapshotStore(prev => ({
          ...prev,
          [year]: [...(prev[year] || []), newEmp]
        }));
      };

      // 사원마스터 행 삭제
      const handleDeleteRow = (empNo) => {
        if (!confirm(`사번 ${empNo} 직원을 이번 연도 스냅샷 명부에서 완전히 삭제하시겠습니까?\n(과거 평가 이력을 보존하려면 '삭제' 대신 상태를 '퇴사'로 변경하는 것을 권장합니다.)`)) return;
        setSnapshotStore(prev => ({
          ...prev,
          [year]: (prev[year] || []).filter(e => e.emp_no !== empNo)
        }));
        if (supabaseClient) {
          supabaseClient.from("employee_snapshots")
            .delete()
            .match({ snapshot_year: year, emp_no: empNo })
            .then(() => {});
        }
      };

      // 전년도(Year - 1) 사원 명부 복사해오기
      const handleCopyPrevYear = () => {
        const prevYear = year - 1;
        const prevList = snapshotStore[prevYear] || [];
        if (prevList.length === 0) {
          alert(`${prevYear}년도 사원 마스터 데이터가 존재하지 않습니다.`);
          return;
        }
        if (currentYearEmployees.length > 0 && !confirm(`${year}년도에 이미 사원 데이터가 존재합니다. 덮어씌우시겠습니까?`)) {
          return;
        }
        // 전년도 명부 중 '재직'자 위주로 연도만 변경하여 복제
        const copied = prevList.map(e => ({
          ...e,
          snapshot_year: year
        }));
        setSnapshotStore(prev => ({ ...prev, [year]: copied }));
        alert(`${prevYear}년도 명부(${copied.length}명)를 ${year}년도 12.31 스냅샷으로 성공적으로 불러왔습니다.`);
      };

      // 사원마스터 Supabase 저장
      const handleSaveSnapshotMaster = async () => {
        if (!supabaseClient) {
          alert("Supabase 설정이 없어 브라우저에만 저장되었습니다.");
          return;
        }
        const { error } = await supabaseClient.from("employee_snapshots").upsert(currentYearEmployees, { onConflict: "snapshot_year,emp_no" });
        if (error) alert("사원마스터 저장 실패: " + error.message);
        else alert(`${year}년도 사원마스터(${currentYearEmployees.length}명)가 Supabase에 영구 보관되었습니다.`);
      };

      // 평가데이터 전체 저장 (Upsert)
      const handleSaveAllEvals = async () => {
        if (!supabaseClient) {
          alert("Supabase 설정이 없어 로컬에만 저장되었습니다.");
          return;
        }
        const records = filteredEmps.map(e => {
          const ev = currentYearEvals[e.emp_no] || {};
          return {

        tab === "snapshot_master" ? h("div", { className: "bg-white border border-slate-200/80 rounded-2xl p-6 shadow-sm space-y-4" },
          h("div", { className: "flex flex-wrap justify-between items-center gap-3 border-b pb-4" },
            h("div", null,
              h("h2", { className: "text-base font-extrabold text-slate-800 flex items-center gap-2" },
                h("i", { className: "fa-solid fa-file-excel text-emerald-600" }),
                `${year}년 12월 31일 기준 사원 마스터 스냅샷 (${currentYearEmployees.length}명)`
              ),
              h("p", { className: "text-xs text-slate-400 mt-0.5" },
                "엑셀 시트처럼 표 안의 셀을 직접 클릭하여 수정할 수 있으며, 퇴사자는 '상태'를 퇴사로 변경하고 퇴사일자를 기재합니다."
              )
            ),

            h("div", { className: "flex items-center gap-2" },
              h("button", {
                onClick: handleCopyPrevYear,
                className: "px-3.5 py-1.5 text-xs font-bold rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center gap-1.5 border"
              }, h("i", { className: "fa-solid fa-clone text-[11px]" }), `${year-1}년도 명부 복사해오기`),

              h("button", {
                onClick: handleAddRow,
                className: "px-3.5 py-1.5 text-xs font-bold rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white flex items-center gap-1.5 shadow-sm"
              }, h("i", { className: "fa-solid fa-plus text-[11px]" }), "행 추가"),

              h("button", {
                onClick: handleSaveSnapshotMaster,
                className: "px-4 py-1.5 text-xs font-bold rounded-xl bg-blue-600 hover:bg-blue-500 text-white flex items-center gap-1.5 shadow-sm"
              }, h("i", { className: "fa-solid fa-floppy-disk text-[11px]" }), "사원마스터 저장")
            )
          ),

          // 엑셀형 풀 그리드 테이블
          h("div", { className: "overflow-x-auto rounded-xl border border-slate-200" },
            h("table", { className: "w-full text-left text-xs border-collapse" },
              h("thead", { className: "bg-slate-100 text-slate-700 font-bold border-b" },
                h("tr", null,
                  h("th", { className: "p-2.5 text-center w-12" }, "No"),
                  h("th", { className: "p-2.5 w-24" }, "사번"),
                  h("th", { className: "p-2.5 w-24" }, "성명"),
                  h("th", { className: "p-2.5 w-28" }, "부서"),
                  h("th", { className: "p-2.5 w-24" }, "직위"),
                  h("th", { className: "p-2.5 text-center w-24" }, "상태"),
                  h("th", { className: "p-2.5 text-center w-28" }, "생년월일"),
                  h("th", { className: "p-2.5 text-center w-28" }, "입사일자"),
                  h("th", { className: "p-2.5 text-center w-28" }, "최근승진일"),
                  h("th", { className: "p-2.5 text-center w-28" }, "퇴사일자"),
                  h("th", { className: "p-2.5" }, "비고 / 직무"),
                  h("th", { className: "p-2.5 text-center w-14" }, "삭제")
                )
              ),
              h("tbody", { className: "divide-y divide-slate-100" },
                currentYearEmployees.map((emp, idx) => {
                  return h("tr", { key: emp.emp_no, className: "hover:bg-blue-50/20 " + (emp.status === "퇴사" ? "bg-rose-50/30" : "") },
                    h("td", { className: "p-2 text-center text-slate-400 font-mono text-[11px]" }, idx + 1),

                    // 사번
                    h("td", { className: "p-1.5" },
                      h("input", {
                        type: "text", value: emp.emp_no,
                        onChange: e => handleSnapshotCellChange(emp.emp_no, 'emp_no', e.target.value),
                        className: "w-full border-b border-transparent focus:border-blue-500 px-1 py-0.5 font-mono text-slate-700 bg-transparent focus:bg-white focus:outline-none"
                      })
                    ),

                    // 성명
                    h("td", { className: "p-1.5" },
                      h("input", {
                        type: "text", value: emp.name,
                        onChange: e => handleSnapshotCellChange(emp.emp_no, 'name', e.target.value),
                        className: "w-full border-b border-transparent focus:border-blue-500 px-1 py-0.5 font-bold text-slate-900 bg-transparent focus:bg-white focus:outline-none"
                      })
                    ),

                    // 부서
                    h("td", { className: "p-1.5" },
                      h("select", {
                        value: emp.dept,
                        onChange: e => handleSnapshotCellChange(emp.emp_no, 'dept', e.target.value),
                        className: "w-full border-b border-transparent focus:border-blue-500 px-1 py-0.5 bg-transparent focus:bg-white focus:outline-none"
                      },
                        DEPARTMENTS.map(d => h("option", { key: d, value: d }, d))
                      )
                    ),

                    // 직위
                    h("td", { className: "p-1.5" },
                      h("select", {
                        value: emp.position,
                        onChange: e => handleSnapshotCellChange(emp.emp_no, 'position', e.target.value),
                        className: "w-full border-b border-transparent focus:border-blue-500 px-1 py-0.5 font-semibold bg-transparent focus:bg-white focus:outline-none"
                      },
                        POSITIONS.map(p => h("option", { key: p, value: p }, p))
                      )
                    ),

                    // 상태 (재직 / 퇴사 / 휴직)
                    h("td", { className: "p-1.5 text-center" },
                      h("select", {
                        value: emp.status || "재직",
                        onChange: e => handleSnapshotCellChange(emp.emp_no, 'status', e.target.value),
                        className: "px-2 py-0.5 rounded font-bold text-[11px] " + (emp.status === "재직" ? "bg-emerald-100 text-emerald-800" : "bg-rose-100 text-rose-800")
                      },
                        STATUS_LIST.map(s => h("option", { key: s, value: s }, s))
                      )
                    ),

                    // 생년월일
                    h("td", { className: "p-1.5 text-center" },
                      h("input", {
                        type: "date", value: emp.birth_date || "",
                        onChange: e => handleSnapshotCellChange(emp.emp_no, 'birth_date', e.target.value),
                        className: "border-b border-transparent focus:border-blue-500 px-1 py-0.5 text-[11px] bg-transparent focus:bg-white focus:outline-none"
                      })
                    ),

                    // 입사일자
                    h("td", { className: "p-1.5 text-center" },
                      h("input", {
                        type: "date", value: emp.hire_date || "",
                        onChange: e => handleSnapshotCellChange(emp.emp_no, 'hire_date', e.target.value),
                        className: "border-b border-transparent focus:border-blue-500 px-1 py-0.5 text-[11px] bg-transparent focus:bg-white focus:outline-none"
                      })
                    ),

                    // 최근승진일
                    h("td", { className: "p-1.5 text-center" },
                      h("input", {
                        type: "date", value: emp.promo_date || "",
                        onChange: e => handleSnapshotCellChange(emp.emp_no, 'promo_date', e.target.value),
                        className: "border-b border-transparent focus:border-blue-500 px-1 py-0.5 text-[11px] bg-transparent focus:bg-white focus:outline-none"
                      })
                    ),

                    // 퇴사일자
                    h("td", { className: "p-1.5 text-center" },
                      h("input", {
                        type: "date", value: emp.retire_date || "",
                        onChange: e => handleSnapshotCellChange(emp.emp_no, 'retire_date', e.target.value),
                        className: "border-b border-transparent focus:border-blue-500 px-1 py-0.5 text-[11px] bg-transparent focus:bg-white focus:outline-none text-rose-600"
                      })
                    ),

                    // 비고
                    h("td", { className: "p-1.5" },
                      h("input", {
                        type: "text", value: emp.remarks || "", placeholder: "비고 입력",
                        onChange: e => handleSnapshotCellChange(emp.emp_no, 'remarks', e.target.value),
                        className: "w-full border-b border-transparent focus:border-blue-500 px-1 py-0.5 text-slate-600 bg-transparent focus:bg-white focus:outline-none"
                      })
                    ),

                    // 행 삭제 버튼
                    h("td", { className: "p-1.5 text-center" },
                      h("button", {
                        onClick: () => handleDeleteRow(emp.emp_no),
                        className: "text-slate-300 hover:text-rose-600 transition"
                      }, h("i", { className: "fa-regular fa-trash-can" }))
                    )
                  );
                })
              )
            )
          )
        ) : null,

        // 가중치 산출기준표 팝업
        isWeightGuideOpen ? (
          h("div", { className: "fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
            h("div", { className: "bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-200" },
              h("div", { className: "flex justify-between items-center mb-4 pb-2 border-b" },
                h("h3", { className: "font-black text-slate-800 text-base flex items-center gap-2" },
                  h("i", { className: "fa-solid fa-scale-balanced text-blue-600" }),
                  "직급별 평가항목 가중치 산출기준표"
                ),
                h("button", { onClick: () => setIsWeightGuideOpen(false), className: "text-slate-400 hover:text-slate-600" },
                  h("i", { className: "fa-solid fa-xmark text-lg" })
                )
              ),
              h("div", { className: "space-y-4 text-xs text-slate-600" },
                h("table", { className: "w-full border-collapse text-center" },
                  h("thead", { className: "bg-slate-100 text-slate-700 font-bold" },
                    h("tr", null,
                      h("th", { className: "p-2.5 border" }, "구분"),
                      h("th", { className: "p-2.5 border" }, "역량"),
                      h("th", { className: "p-2.5 border" }, "성과"),
                      h("th", { className: "p-2.5 border" }, "자기계발"),
                      h("th", { className: "p-2.5 border" }, "부하육성")
                    )
                  ),
                  h("tbody", null,
                    h("tr", null,
                      h("td", { className: "p-2.5 border font-bold bg-slate-50" }, "임원진"),
                      h("td", { className: "p-2.5 border text-slate-300" }, "-"),
                      h("td", { className: "p-2.5 border font-bold text-blue-600" }, "80%"),
                      h("td", { className: "p-2.5 border" }, "10%"),
                      h("td", { className: "p-2.5 border" }, "10%")
                    ),
                    h("tr", null,
                      h("td", { className: "p-2.5 border font-bold bg-slate-50" }, "실장 · 부장 · 차장"),
                      h("td", { className: "p-2.5 border font-bold" }, "30%"),
                      h("td", { className: "p-2.5 border font-bold text-blue-600" }, "60%"),
                      h("td", { className: "p-2.5 border" }, "10%"),
                      h("td", { className: "p-2.5 border text-slate-300" }, "-")
                    ),
                    h("tr", null,
                      h("td", { className: "p-2.5 border font-bold bg-slate-50" }, "과장 · 대리"),
                      h("td", { className: "p-2.5 border font-bold text-blue-600" }, "60%"),
                      h("td", { className: "p-2.5 border font-bold" }, "40%"),
                      h("td", { className: "p-2.5 border text-slate-300" }, "-"),
                      h("td", { className: "p-2.5 border text-slate-300" }, "-")
                    ),
                    h("tr", null,
                      h("td", { className: "p-2.5 border font-bold bg-slate-50" }, "주임 · 사원"),
                      h("td", { className: "p-2.5 border font-bold text-blue-600" }, "70%"),
                      h("td", { className: "p-2.5 border font-bold" }, "30%"),
                      h("td", { className: "p-2.5 border text-slate-300" }, "-"),
                      h("td", { className: "p-2.5 border text-slate-300" }, "-")
                    )
                  )
                )
              ),
              h("div", { className: "flex justify-end pt-4 border-t mt-4" },
                h("button", { onClick: () => setIsWeightGuideOpen(false), className: "px-4 py-2 rounded-xl bg-slate-900 text-white font-bold" }, "확인 닫기")
              )
            )
          )
        ) : null,

        // Supabase 설정 모달
        isConfigOpen ? (
          h("div", { className: "fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
            h("div", { className: "bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-200" },
              h("h3", { className: "font-black text-slate-800 text-base mb-3 pb-2 border-b flex items-center gap-2" },
                h("i", { className: "fa-solid fa-cloud text-blue-600" }),
                "Supabase 클라우드 설정"
              ),
              h("div", { className: "space-y-3.5 text-xs" },
                h("div", null,
                  h("label", { className: "block text-slate-600 font-bold mb-1" }, "Project URL"),
                  h("input", {
                    type: "text", id: "sb_url_input", defaultValue: sbConfig.url,
                    placeholder: "https://xxxxxxxx.supabase.co",
                    className: "w-full border rounded-xl px-3 py-2 font-mono"
                  })
                ),
                h("div", null,
                  h("label", { className: "block text-slate-600 font-bold mb-1" }, "Anon / Public API Key"),
                  h("textarea", {
                    id: "sb_key_input", defaultValue: sbConfig.key, rows: 3,
                    placeholder: "eyJh...",
                    className: "w-full border rounded-xl px-3 py-2 font-mono"
                  })
                )
              ),
              h("div", { className: "flex justify-end gap-2 pt-4 border-t mt-4" },
                h("button", { onClick: () => setIsConfigOpen(false), className: "px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs" }, "닫기"),
                h("button", {
                  onClick: () => {
                    const u = document.getElementById("sb_url_input").value.trim();
                    const k = document.getElementById("sb_key_input").value.trim();
                    localStorage.setItem("ds_sb_url", u);
                    localStorage.setItem("ds_sb_key", k);
                    setSbConfig({ url: u, key: k });
                    setIsConfigOpen(false);
                    alert("Supabase 연결 정보가 등록되었습니다.");
                  },
                  className: "px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs shadow-md"
                }, "설정 저장")
              )
            )
          )
        ) : null
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
