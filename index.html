<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대성스틸 인사평가 및 승진심사 관리시스템</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const GRADES = ["S", "A", "B", "C", "D"];
    const GRADE_POINTS = { S: 10, A: 8, B: 6, C: 4, D: 2 };
    const pointsFor = (g) => (g ? GRADE_POINTS[g] || 0 : 0);

    const GRADE_TARGET_RATE = { S: 5, A: 15, B: 65, C: 10, D: 5 };
    const recommendedCount = (n, g) => (Math.round(n * (GRADE_TARGET_RATE[g] / 100) * 10) / 10).toFixed(1);

    const DEPARTMENTS = ["관리팀", "영업팀", "생산관리팀", "생산팀"];
    const POSITIONS = ["사장", "부사장", "전무", "상무", "이사", "실장", "부장", "차장", "과장", "대리", "주임", "사원"];

    const EXEC = { competency: 0, performance: 0.8, selfDev: 0.1, mentoring: 0.1 };
    const SENIOR = { competency: 0.3, performance: 0.6, selfDev: 0.1, mentoring: 0 };
    const MID = { competency: 0.6, performance: 0.4, selfDev: 0, mentoring: 0 };
    const JUNIOR = { competency: 0.7, performance: 0.3, selfDev: 0, mentoring: 0 };

    function weightsFor(position) {
      if (["사장", "부사장", "전무", "상무", "이사"].includes(position)) return EXEC;
      if (["실장", "부장", "차장"].includes(position)) return SENIOR;
      if (["과장", "대리"].includes(position)) return MID;
      return JUNIOR;
    }

    function finalScore(position, ev) {
      const w = weightsFor(position);
      const n = (v) => (v === "" || v === null || isNaN(v) ? 0 : parseFloat(v));
      const sum = (n(ev.competency) * w.competency) +
                  (n(ev.performance) * w.performance) +
                  (n(ev.selfDev) * w.selfDev) +
                  (n(ev.mentoring) * w.mentoring);
      return Math.round((sum + n(ev.adjust)) * 10) / 10;
    }

    const DEFAULT_EMPLOYEES = [
      { emp_no: "10011", name: "김종현", dept: "관리팀", position: "실장", birth_date: "1975-02-06", hire_date: "2001-03-12", promo_date: "2024-01-01" },
      { emp_no: "90005", name: "정승애", dept: "관리팀", position: "과장", birth_date: "1987-08-05", hire_date: "2009-08-06", promo_date: "2025-01-01" },
      { emp_no: "100007", name: "염지원", dept: "관리팀", position: "과장", birth_date: "1981-08-03", hire_date: "2010-05-25", promo_date: "2025-01-01" },
      { emp_no: "230003", name: "강현구", dept: "관리팀", position: "사원", birth_date: "1995-01-10", hire_date: "2023-10-01", promo_date: "2023-10-01" },
      { emp_no: "10023", name: "이영숙", dept: "영업팀", position: "부장", birth_date: "1980-09-24", hire_date: "2001-08-20", promo_date: "2024-01-01" },
      { emp_no: "130031", name: "유도근", dept: "영업팀", position: "부장", birth_date: "1980-11-16", hire_date: "2010-10-11", promo_date: "2024-01-01" },
      { emp_no: "140017", name: "김영진", dept: "영업팀", position: "부장", birth_date: "1972-10-19", hire_date: "2014-09-01", promo_date: "2025-01-01" },
      { emp_no: "90007", name: "우국진", dept: "영업팀", position: "차장", birth_date: "1983-09-21", hire_date: "2009-08-24", promo_date: "2022-01-01" },
      { emp_no: "150019", name: "김영민", dept: "영업팀", position: "차장", birth_date: "1984-01-25", hire_date: "2007-12-01", promo_date: "2023-01-01" },
      { emp_no: "220002", name: "박성진", dept: "영업팀", position: "과장", birth_date: "1983-12-11", hire_date: "2022-04-01", promo_date: "2022-04-01" },
      { emp_no: "180003", name: "김영수", dept: "영업팀", position: "과장", birth_date: "1984-07-19", hire_date: "2018-04-16", promo_date: "2024-01-01" },
      { emp_no: "160010", name: "배대호", dept: "영업팀", position: "과장", birth_date: "1982-01-05", hire_date: "2016-06-20", promo_date: "2025-01-01" },
      { emp_no: "210006", name: "김상문", dept: "영업팀", position: "대리", birth_date: "1987-03-24", hire_date: "2021-08-01", promo_date: "2023-01-01" },
      { emp_no: "180016", name: "윤종길", dept: "생산관리팀", position: "부장", birth_date: "1976-08-27", hire_date: "2018-09-17", promo_date: "2024-01-01" },
      { emp_no: "150020", name: "김명수", dept: "생산관리팀", position: "차장", birth_date: "1982-12-08", hire_date: "2013-03-04", promo_date: "2023-01-01" },
      { emp_no: "220005", name: "송병섭", dept: "생산관리팀", position: "대리", birth_date: "1994-06-21", hire_date: "2022-06-01", promo_date: "2024-01-01" },
      { emp_no: "10022", name: "조원일", dept: "생산팀", position: "부장", birth_date: "1980-07-28", hire_date: "2001-08-16", promo_date: "2024-01-01" },
      { emp_no: "80009", name: "서재천", dept: "생산팀", position: "차장", birth_date: "1982-02-12", hire_date: "2008-09-01", promo_date: "2023-01-01" },
      { emp_no: "100010", name: "문정식", dept: "생산팀", position: "차장", birth_date: "1983-02-09", hire_date: "2010-09-01", promo_date: "2025-01-01" },
      { emp_no: "110008", name: "정태현", dept: "생산팀", position: "과장", birth_date: "1981-06-15", hire_date: "2011-09-01", promo_date: "2024-01-01" },
      { emp_no: "130005", name: "안상호", dept: "생산팀", position: "과장", birth_date: "1981-12-07", hire_date: "2013-03-01", promo_date: "2024-01-01" },
      { emp_no: "150005", name: "송성민", dept: "생산팀", position: "과장", birth_date: "1985-05-24", hire_date: "2015-03-09", promo_date: "2024-01-01" },
      { emp_no: "170001", name: "김동훈", dept: "생산팀", position: "과장", birth_date: "1985-08-15", hire_date: "2017-01-02", promo_date: "2024-01-01" },
      { emp_no: "170014", name: "김영호", dept: "생산팀", position: "과장", birth_date: "1987-10-18", hire_date: "2017-08-01", promo_date: "2025-01-01" },
      { emp_no: "180018", name: "문태환", dept: "생산팀", position: "과장", birth_date: "1987-03-04", hire_date: "2018-09-17", promo_date: "2025-01-01" },
      { emp_no: "210004", name: "장민석", dept: "생산팀", position: "대리", birth_date: "1994-06-03", hire_date: "2021-06-01", promo_date: "2024-01-01" },
      { emp_no: "230001", name: "김형진", dept: "생산팀", position: "주임", birth_date: "1994-07-28", hire_date: "2023-04-01", promo_date: "2025-01-01" },
      { emp_no: "230005", name: "이현규", dept: "생산팀", position: "사원", birth_date: "1998-03-10", hire_date: "2023-12-01", promo_date: "2023-12-01" }
    ];

    const gradeColor = {
      S: "bg-blue-600 text-white",
      A: "bg-emerald-600 text-white",
      B: "bg-indigo-500 text-white",
      C: "bg-amber-500 text-white",
      D: "bg-rose-500 text-white",
    };

    function App() {
      const [sbConfig, setSbConfig] = useState(() => ({
        url: localStorage.getItem("ds_sb_url") || "",
        key: localStorage.getItem("ds_sb_key") || ""
      }));
      const [supabaseClient, setSupabaseClient] = useState(null);
      const [isConfigOpen, setIsConfigOpen] = useState(false);
      const [isEmpModalOpen, setIsEmpModalOpen] = useState(false);
      const [editingEmp, setEditingEmp] = useState(null);

      const [year, setYear] = useState(2025);
      const [dept, setDept] = useState("전체");
      const [tab, setTab] = useState("input");
      const [searchQuery, setSearchQuery] = useState("");

      const [employees, setEmployees] = useState(() => {
        const saved = localStorage.getItem("ds_emp_master_v1");
        return saved ? JSON.parse(saved) : DEFAULT_EMPLOYEES;
      });

      const [evalStore, setEvalStore] = useState(() => {
        const saved = localStorage.getItem("ds_eval_store_v1");
        return saved ? JSON.parse(saved) : {};
      });

      useEffect(() => {
        if (sbConfig.url && sbConfig.key) {
          try {
            const client = window.supabase.createClient(sbConfig.url, sbConfig.key);
            setSupabaseClient(client);
          } catch(e) {
            console.error("Supabase Init Error", e);
          }
        }
      }, [sbConfig]);

      useEffect(() => {
        if (!supabaseClient) return;

        supabaseClient.from("employees").select("*").eq("is_active", true).order("emp_no").then(({ data, error }) => {
          if (!error && data && data.length > 0) {
            setEmployees(data);
            localStorage.setItem("ds_emp_master_v1", JSON.stringify(data));
          } else if (data && data.length === 0) {
            supabaseClient.from("employees").upsert(DEFAULT_EMPLOYEES).then(() => {});
          }
        });

        supabaseClient.from("annual_evaluations").select("*").eq("eval_year", year).then(({ data, error }) => {
          if (!error && data && data.length > 0) {
            const loaded = {};
            data.forEach(r => {
              loaded[r.emp_no] = {
                competency: r.comp_score !== null ? r.comp_score : "",
                performance: r.perf_score !== null ? r.perf_score : "",
                selfDev: r.self_dev_score !== null ? r.self_dev_score : "",
                mentoring: r.leadership_score !== null ? r.leadership_score : "",
                adjust: r.adj_score !== null ? r.adj_score : "",
                adjustReason: r.adj_reason || "",
                grade: r.final_grade || "",
                note: r.remarks || ""
              };
            });
            setEvalStore(prev => ({ ...prev, [year]: loaded }));
          }
        });
      }, [supabaseClient, year]);

      useEffect(() => {
        localStorage.setItem("ds_emp_master_v1", JSON.stringify(employees));
      }, [employees]);

      useEffect(() => {
        localStorage.setItem("ds_eval_store_v1", JSON.stringify(evalStore));
      }, [evalStore]);

      const filteredEmps = useMemo(() => {
        return employees.filter(e => {
          const matchDept = dept === "전체" || e.dept === dept;
          const matchSearch = searchQuery === "" || 
            (e.name && e.name.includes(searchQuery)) || 
            (e.emp_no && e.emp_no.includes(searchQuery)) || 
            (e.position && e.position.includes(searchQuery));
          return matchDept && matchSearch;
        });
      }, [employees, dept, searchQuery]);

      const currentYearEvals = evalStore[year] || {};
      const counts = useMemo(() => {
        const c = { S: 0, A: 0, B: 0, C: 0, D: 0 };
        filteredEmps.forEach(e => {
          const g = currentYearEvals[e.emp_no]?.grade;
          if (g && c[g] !== undefined) c[g]++;
        });
        return c;
      }, [filteredEmps, currentYearEvals]);

      const totalCount = filteredEmps.length;
      const gradedTotal = GRADES.reduce((s, g) => s + counts[g], 0);
      const getPct = (c) => (totalCount > 0 ? Math.round((c / totalCount) * 1000) / 10 : 0);

      const handleCellChange = (empNo, field, value) => {
        setEvalStore(prev => {
          const yData = prev[year] || {};
          const empEval = yData[empNo] || { competency: "", performance: "", selfDev: "", mentoring: "", adjust: "", adjustReason: "", grade: "", note: "" };
          const updatedEval = { ...empEval, [field]: value };
          return { ...prev, [year]: { ...yData, [empNo]: updatedEval } };
        });
      };

      const handleSaveAll = async () => {
        if (!supabaseClient) {
          alert("Supabase 설정이 등록되지 않아 로컬 브라우저에만 저장되었습니다.");
          return;
        }
        const records = filteredEmps.map(e => {
          const ev = currentYearEvals[e.emp_no] || {};
          const fScore = finalScore(e.position, ev);
          const pPoints = pointsFor(ev.grade);
          return {
            eval_year: year,
            emp_no: e.emp_no,
            comp_score: ev.competency === "" ? null : ev.competency,
            perf_score: ev.performance === "" ? null : ev.performance,
            self_dev_score: ev.selfDev === "" ? null : ev.selfDev,
            leadership_score: ev.mentoring === "" ? null : ev.mentoring,
            adj_score: ev.adjust === "" ? null : ev.adjust,
            adj_reason: ev.adjustReason || null,
            final_score: fScore,
            final_grade: ev.grade || null,
            promo_points: pPoints,
            remarks: ev.note || null
          };
        });

        const { error } = await supabaseClient.from("annual_evaluations").upsert(records, { onConflict: "eval_year,emp_no" });
        if (error) {
          alert("저장 실패: " + error.message);
        } else {
          alert("Supabase에 " + records.length + "명의 평가 데이터가 안전하게 저장되었습니다.");
        }
      };

      const handleSaveEmployee = async (empData) => {
        if (!editingEmp && employees.some(e => e.emp_no === empData.emp_no)) {
          alert("이미 존재하는 사번입니다.");
          return;
        }

        let updated;
        if (editingEmp) {
          updated = employees.map(e => e.emp_no === editingEmp.emp_no ? empData : e);
        } else {
          updated = [...employees, empData];
        }
        setEmployees(updated);

        if (supabaseClient) {
          await supabaseClient.from("employees").upsert(empData);
        }

        setIsEmpModalOpen(false);
        setEditingEmp(null);
      };

      return (
        <div className="max-w-[1550px] mx-auto p-6 space-y-6">
          <header className="bg-slate-900 text-white rounded-xl p-4 shadow-md flex flex-wrap justify-between items-center gap-4">
            <div className="flex items-center gap-3">
              <span className="p-2 rounded bg-blue-600 text-white font-bold"><i className="fa-solid fa-users-gear"></i></span>
              <div>
                <h1 className="text-lg font-bold tracking-tight">대성스틸 인사평가 및 승진심사 관리시스템</h1>
                <p className="text-xs text-slate-400">대표이사 최종 원점수 환산 및 그룹 평가 기준율 검증</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <div className="flex items-center bg-slate-800 rounded-lg p-1 border border-slate-700">
                <button onClick={() => setYear(y => y - 1)} className="px-2 py-1 text-slate-400 hover:text-white"><</button>
                <span className="px-3 py-1 font-bold text-sm text-amber-400"><i className="fa-regular fa-calendar mr-1.5"></i>{year}년 귀속</span>
                <button onClick={() => setYear(y => y + 1)} className="px-2 py-1 text-slate-400 hover:text-white">></button>
              </div>

              <div className="flex bg-slate-800 p-1 rounded-lg">
                <button
                  onClick={() => setTab("input")}
                  className={`px-3 py-1.5 text-xs font-bold rounded ${tab === 'input' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}
                ><i className="fa-solid fa-pen-to-square mr-1"></i>평가 결과 입력</button>
                <button
                  onClick={() => setTab("promo")}
                  className={`px-3 py-1.5 text-xs font-bold rounded ${tab === 'promo' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}
                ><i className="fa-solid fa-table-list mr-1"></i>다년도 승진심사 매트릭스</button>
              </div>

              <button
                onClick={() => { setEditingEmp(null); setIsEmpModalOpen(true); }}
                className="px-3 py-1.5 text-xs font-bold rounded bg-emerald-600 hover:bg-emerald-700 text-white flex items-center gap-1.5 shadow-sm"
              >
                <i className="fa-solid fa-user-plus"></i> 사원 마스터 관리
              </button>

              <button
                onClick={() => setIsConfigOpen(true)}
                className={`px-3 py-1.5 text-xs font-bold rounded flex items-center gap-1.5 ${supabaseClient ? 'bg-slate-800 text-emerald-400 border border-emerald-500/50' : 'bg-amber-600 text-white'}`}
              >
                <i className="fa-solid fa-database"></i> {supabaseClient ? "Supabase 연동됨" : "Supabase 설정"}
              </button>
            </div>
          </header>

          <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-wrap justify-between items-center gap-3">
            <div className="flex flex-wrap items-center gap-2">
              <span className="text-xs font-bold text-slate-500 mr-1"><i className="fa-solid fa-filter mr-1"></i>부서 필터:</span>
              <button
                onClick={() => setDept("전체")}
                className={`px-3 py-1 text-xs font-bold rounded-lg transition ${dept === '전체' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
              >전체부서 ({employees.length})</button>
              {DEPARTMENTS.map(d => {
                const count = employees.filter(e => e.dept === d).length;
                return (
                  <button
                    key={d}
                    onClick={() => setDept(d)}
                    className={`px-3 py-1 text-xs font-bold rounded-lg transition ${dept === d ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                  >{d} ({count})</button>
                );
              })}
            </div>

            <div className="flex items-center gap-3">
              <div className="relative">
                <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                <input
                  type="text"
                  placeholder="성명, 사번, 직위 검색..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="pl-8 pr-3 py-1.5 text-xs border border-slate-300 rounded-lg w-52 focus:outline-blue-500"
                />
              </div>

              <button
                onClick={handleSaveAll}
                className="px-4 py-1.5 text-xs font-bold rounded-lg bg-blue-600 hover:bg-blue-700 text-white flex items-center gap-1.5 shadow-sm"
              >
                <i className="fa-solid fa-cloud-arrow-up"></i> 평가데이터 저장 (Upsert)
              </button>
            </div>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-6 gap-3">
            <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-col justify-between">
              <span className="text-xs font-semibold text-slate-400">전체 부서 평가 대상</span>
              <div className="my-2">
                <span className="text-3xl font-black text-slate-800">{totalCount}</span>
                <span className="text-sm font-semibold text-slate-500 ml-1">명</span>
              </div>
              <div className="text-[11px] text-slate-500 bg-slate-50 px-2 py-1 rounded">
                배분 완료: <b className="text-blue-600">{gradedTotal}명</b> ({getPct(gradedTotal)}%)
              </div>
            </div>

            {GRADES.map(grade => {
              const targetRate = GRADE_TARGET_RATE[grade];
              const recCount = recommendedCount(totalCount, grade);
              const curCount = counts[grade];
              const curRate = getPct(curCount);
              const isOver = curCount > Math.round(parseFloat(recCount));

              return (
                <div key={grade} className={`bg-white border rounded-xl p-4 shadow-sm flex flex-col justify-between transition ${isOver && curCount > 0 ? 'border-amber-400 bg-amber-50/20' : 'border-slate-200'}`}>
                  <div className="flex justify-between items-center">
                    <span className="font-extrabold text-sm text-slate-700 flex items-center gap-1.5">
                      <span className={`w-5 h-5 rounded flex items-center justify-center text-xs ${gradeColor[grade]}`}>
                        {grade}
                      </span>
                      {grade}등급
                    </span>
                    <span className="text-xs text-slate-400 font-medium">기준 {targetRate}%</span>
                  </div>

                  <div className="my-2 flex items-baseline gap-2">
                    <span className="text-2xl font-black text-slate-800">{curCount}명</span>
                    <span className="text-xs font-bold text-slate-500">({curRate}%)</span>
                  </div>

                  <div className="flex justify-between items-center text-xs pt-2 border-t border-slate-100">
                    <span className="text-slate-400">권장: <b className="text-slate-700">{recCount}명</b></span>
                    <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${isOver && curCount > 0 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>
                      {isOver && curCount > 0 ? '초과주의' : '적정'}
                    </span>
                  </div>
                </div>
              );
            })}
          </div>

          {tab === "input" ? (
            <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
              <div className="px-5 py-3 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                <span className="text-xs font-bold text-slate-700">
                  <i className="fa-solid fa-list-check mr-1.5 text-blue-600"></i> {year}년도 인사평가 결과 입력 ({dept} · {filteredEmps.length}명)
                </span>
                <span className="text-xs text-slate-500">
                  * 사원 성명을 클릭하면 사원 마스터(직위, 부서, 승진일자)를 바로 수정할 수 있습니다.
                </span>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead className="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200">
                    <tr>
                      <th className="p-3 text-center w-14">사번</th>
                      <th className="p-3 w-20">성명</th>
                      <th className="p-3 w-24">부서</th>
                      <th className="p-3 w-16">직위</th>
                      <th className="p-3 text-center w-20 bg-blue-50/50">역량</th>
                      <th className="p-3 text-center w-20 bg-blue-50/50">성과</th>
                      <th className="p-3 text-center w-20 bg-blue-50/50">자기계발</th>
                      <th className="p-3 text-center w-20 bg-blue-50/50">부하육성</th>
                      <th className="p-3 text-center w-24">가감점 / 사유</th>
                      <th className="p-3 text-center w-24 bg-slate-200/60 font-bold text-slate-800">최종 환산점수</th>
                      <th className="p-3 text-center w-24">최종 등급</th>
                      <th className="p-3 text-center w-20">승진 포인트</th>
                      <th className="p-3">특이사항</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filteredEmps.map(emp => {
                      const ev = currentYearEvals[emp.emp_no] || { competency: "", performance: "", selfDev: "", mentoring: "", adjust: "", adjustReason: "", grade: "", note: "" };
                      const w = weightsFor(emp.position);
                      const fScore = finalScore(emp.position, ev);
                      const points = pointsFor(ev.grade);

                      return (
                        <tr key={emp.emp_no} className="hover:bg-blue-50/30 transition">
                          <td className="p-2.5 text-center font-mono text-slate-400">{emp.emp_no}</td>
                          <td className="p-2.5">
                            <button
                              onClick={() => { setEditingEmp(emp); setIsEmpModalOpen(true); }}
                              className="font-bold text-blue-600 hover:underline flex items-center gap-1"
                            >
                              {emp.name} <i className="fa-solid fa-pen text-[10px] text-slate-300"></i>
                            </button>
                          </td>
                          <td className="p-2.5 text-slate-600">{emp.dept}</td>
                          <td className="p-2.5 font-semibold text-slate-700">{emp.position}</td>

                          <td className="p-2 text-center bg-blue-50/20">
                            {w.competency > 0 ? (
                              <div>
                                <input
                                  type="number"
                                  step="0.5"
                                  value={ev.competency}
                                  onChange={e => handleCellChange(emp.emp_no, 'competency', e.target.value === "" ? "" : parseFloat(e.target.value))}
                                  className="w-16 border rounded px-1.5 py-1 text-center font-semibold bg-white focus:outline-blue-500"
                                />
                                <div className="text-[10px] text-slate-400 mt-0.5">{w.competency * 100}%</div>
                              </div>
                            ) : <span className="text-slate-300">-</span>}
                          </td>

                          <td className="p-2 text-center bg-blue-50/20">
                            {w.performance > 0 ? (
                              <div>
                                <input
                                  type="number"
                                  step="0.5"
                                  value={ev.performance}
                                  onChange={e => handleCellChange(emp.emp_no, 'performance', e.target.value === "" ? "" : parseFloat(e.target.value))}
                                  className="w-16 border rounded px-1.5 py-1 text-center font-semibold bg-white focus:outline-blue-500"
                                />
                                <div className="text-[10px] text-slate-400 mt-0.5">{w.performance * 100}%</div>
                              </div>
                            ) : <span className="text-slate-300">-</span>}
                          </td>

                          <td className="p-2 text-center bg-blue-50/20">
                            {w.selfDev > 0 ? (
                              <div>
                                <input
                                  type="number"
                                  step="0.5"
                                  value={ev.selfDev}
                                  onChange={e => handleCellChange(emp.emp_no, 'selfDev', e.target.value === "" ? "" : parseFloat(e.target.value))}
                                  className="w-16 border rounded px-1.5 py-1 text-center font-semibold bg-white focus:outline-blue-500"
                                />
                                <div className="text-[10px] text-slate-400 mt-0.5">{w.selfDev * 100}%</div>
                              </div>
                            ) : <span className="text-slate-300">-</span>}
                          </td>

                          <td className="p-2 text-center bg-blue-50/20">
                            {w.mentoring > 0 ? (
                              <div>
                                <input
                                  type="number"
                                  step="0.5"
                                  value={ev.mentoring}
                                  onChange={e => handleCellChange(emp.emp_no, 'mentoring', e.target.value === "" ? "" : parseFloat(e.target.value))}
                                  className="w-16 border rounded px-1.5 py-1 text-center font-semibold bg-white focus:outline-blue-500"
                                />
                                <div className="text-[10px] text-slate-400 mt-0.5">{w.mentoring * 100}%</div>
                              </div>
                            ) : <span className="text-slate-300">-</span>}
                          </td>

                          <td className="p-2 text-center">
                            <div className="flex items-center gap-1 justify-center">
                              <input
                                type="number"
                                placeholder="±"
                                value={ev.adjust}
                                onChange={e => handleCellChange(emp.emp_no, 'adjust', e.target.value === "" ? "" : parseFloat(e.target.value))}
                                className="w-12 border rounded px-1 py-1 text-center font-medium bg-white focus:outline-blue-500 text-xs"
                              />
                              <input
                                type="text"
                                placeholder="사유"
                                value={ev.adjustReason}
                                onChange={e => handleCellChange(emp.emp_no, 'adjustReason', e.target.value)}
                                className="w-20 border rounded px-1 py-1 text-xs bg-white focus:outline-blue-500"
                              />
                            </div>
                          </td>

                          <td className="p-2.5 text-center font-black text-blue-700 bg-slate-100/70 text-sm">
                            {fScore.toFixed(1)}
                          </td>

                          <td className="p-2 text-center">
                            <select
                              value={ev.grade}
                              onChange={e => handleCellChange(emp.emp_no, 'grade', e.target.value)}
                              className="border border-slate-300 rounded px-2 py-1 font-bold bg-white text-slate-800 shadow-sm focus:outline-blue-500"
                            >
                              <option value="">-</option>
                              {GRADES.map(g => <option key={g} value={g}>{g}</option>)}
                            </select>
                          </td>

                          <td className="p-2.5 text-center">
                            <span className="px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">
                              +{points}P
                            </span>
                          </td>

                          <td className="p-2">
                            <input
                              type="text"
                              placeholder="특이사항 메모"
                              value={ev.note}
                              onChange={e => handleCellChange(emp.emp_no, 'note', e.target.value)}
                              className="w-full border rounded px-2 py-1 text-xs text-slate-600 bg-white focus:outline-blue-500"
                            />
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          ) : (
            <div className="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
              <div className="flex justify-between items-center mb-4">
                <h2 className="text-base font-bold text-slate-800 flex items-center gap-2">
                  <i className="fa-solid fa-award text-amber-500"></i> 최근 3개년 승진심사 대상 및 포인트 집계표
                </h2>
                <span className="text-xs text-slate-400">기준: S(10P), A(8P), B(6P), C(4P), D(2P)</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead className="bg-slate-100 text-slate-600 font-semibold border-b">
                    <tr>
                      <th className="p-3">사번</th>
                      <th className="p-3">성명</th>
                      <th className="p-3">부서</th>
                      <th className="p-3">직위</th>
                      <th className="p-3">입사일자</th>
                      <th className="p-3">최근승진일</th>
                      <th className="p-3 text-center">2023년</th>
                      <th className="p-3 text-center">2024년</th>
                      <th className="p-3 text-center bg-blue-50">2025년 (확정)</th>
                      <th className="p-3 text-center font-bold text-slate-800 bg-amber-50">3개년 누적 승진포인트</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filteredEmps.map(emp => {
                      const curGrade = currentYearEvals[emp.emp_no]?.grade || "B";
                      const curPoint = pointsFor(curGrade);
                      const p2023 = 6;
                      const p2024 = 6;
                      const totalPoint = p2023 + p2024 + curPoint;

                      return (
                        <tr key={emp.emp_no} className="hover:bg-slate-50">
                          <td className="p-3 font-mono text-slate-400">{emp.emp_no}</td>
                          <td className="p-3 font-bold text-slate-800">{emp.name}</td>
                          <td className="p-3 text-slate-600">{emp.dept}</td>
                          <td className="p-3 text-slate-700">{emp.position}</td>
                          <td className="p-3 text-slate-500">{emp.hire_date || '-'}</td>
                          <td className="p-3 text-slate-500">{emp.promo_date || '-'}</td>
                          <td className="p-3 text-center text-slate-500">B (6P)</td>
                          <td className="p-3 text-center text-slate-500">B (6P)</td>
                          <td className="p-3 text-center font-bold text-blue-600 bg-blue-50/30">
                            {curGrade} (+{curPoint}P)
                          </td>
                          <td className="p-3 text-center font-black text-amber-700 bg-amber-50/50 text-sm">
                            {totalPoint}P
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {isEmpModalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 border border-slate-200">
                <div className="flex justify-between items-center mb-4 pb-2 border-b">
                  <h3 className="font-bold text-slate-800 text-base">
                    {editingEmp ? "사원 정보 수정" : "신규 사원 등록"}
                  </h3>
                  <button onClick={() => setIsEmpModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  handleSaveEmployee({
                    emp_no: fd.get("emp_no"),
                    name: fd.get("name"),
                    dept: fd.get("dept"),
                    position: fd.get("position"),
                    birth_date: fd.get("birth_date") || null,
                    hire_date: fd.get("hire_date") || null,
                    promo_date: fd.get("promo_date") || null,
                    is_active: true
                  });
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-600 font-bold mb-1">사번</label>
                    <input
                      name="emp_no"
                      defaultValue={editingEmp ? editingEmp.emp_no : ""}
                      readOnly={Boolean(editingEmp)}
                      required
                      placeholder="예: 250001"
                      className="w-full border rounded px-3 py-1.5 font-mono bg-slate-50 focus:outline-blue-500"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-600 font-bold mb-1">성명</label>
                    <input
                      name="name"
                      defaultValue={editingEmp ? editingEmp.name : ""}
                      required
                      placeholder="성명 입력"
                      className="w-full border rounded px-3 py-1.5 font-semibold focus:outline-blue-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-600 font-bold mb-1">부서</label>
                      <select name="dept" defaultValue={editingEmp ? editingEmp.dept : "관리팀"} className="w-full border rounded px-2 py-1.5 focus:outline-blue-500">
                        {DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-600 font-bold mb-1">직위</label>
                      <select name="position" defaultValue={editingEmp ? editingEmp.position : "사원"} className="w-full border rounded px-2 py-1.5 focus:outline-blue-500">
                        {POSITIONS.map(p => <option key={p} value={p}>{p}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block text-slate-600 font-medium mb-1">생년월일</label>
                      <input type="date" name="birth_date" defaultValue={editingEmp ? editingEmp.birth_date : ""} className="w-full border rounded px-1.5 py-1 text-[11px]" />
                    </div>
                    <div>
                      <label className="block text-slate-600 font-medium mb-1">입사일자</label>
                      <input type="date" name="hire_date" defaultValue={editingEmp ? editingEmp.hire_date : ""} className="w-full border rounded px-1.5 py-1 text-[11px]" />
                    </div>
                    <div>
                      <label className="block text-slate-600 font-medium mb-1">최근승진일</label>
                      <input type="date" name="promo_date" defaultValue={editingEmp ? editingEmp.promo_date : ""} className="w-full border rounded px-1.5 py-1 text-[11px]" />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-4 border-t mt-4">
                    <button
                      type="button"
                      onClick={() => setIsEmpModalOpen(false)}
                      className="px-3 py-1.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 rounded bg-blue-600 hover:bg-blue-700 text-white font-bold"
                    >
                      저장하기
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isConfigOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 border border-slate-200">
                <h3 className="font-bold text-slate-800 text-base mb-3 pb-2 border-b">Supabase 클라우드 설정</h3>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-600 font-bold mb-1">Project URL</label>
                    <input
                      type="text"
                      id="sb_url_input"
                      defaultValue={sbConfig.url}
                      placeholder="https://xxxxxxxx.supabase.co"
                      className="w-full border rounded px-3 py-2 font-mono"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-600 font-bold mb-1">Anon / Public API Key</label>
                    <textarea
                      id="sb_key_input"
                      defaultValue={sbConfig.key}
                      rows={3}
                      placeholder="eyJh..."
                      className="w-full border rounded px-3 py-2 font-mono"
                    />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-4 border-t mt-4">
                  <button onClick={() => setIsConfigOpen(false)} className="px-3 py-1.5 rounded bg-slate-100 text-slate-700 font-semibold text-xs">닫기</button>
                  <button onClick={() => {
                    const u = document.getElementById("sb_url_input").value.trim();
                    const k = document.getElementById("sb_key_input").value.trim();
                    localStorage.setItem("ds_sb_url", u);
                    localStorage.setItem("ds_sb_key", k);
                    setSbConfig({ url: u, key: k });
                    setIsConfigOpen(false);
                    alert("Supabase 연결 정보가 저장되었습니다.");
                  }} className="px-4 py-1.5 rounded bg-emerald-600 text-white font-bold text-xs">설정 저장</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
