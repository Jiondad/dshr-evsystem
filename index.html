    const GRADE_POINTS = { S: 10, A: 8, B: 6, C: 4, D: 2 };
    const pointsFor = (g) => (g ? GRADE_POINTS[g] || 0 : 0);

    const GRADE_TARGET_RATE = { S: 5, A: 15, B: 65, C: 10, D: 5 };
    const recommendedCount = (n, g) => (Math.round(n * (GRADE_TARGET_RATE[g] / 100) * 10) / 10).toFixed(1);

    const DEPARTMENTS = ["관리팀", "영업팀", "생산관리팀", "생산팀"];
    const POSITIONS = ["사장", "부사장", "전무", "상무", "이사", "실장", "부장", "차장", "과장", "대리", "주임", "사원"];

    const EXEC = { competency: 0, performance: 0.8, selfDev: 0.1, mentoring: 0.1, label: "임원 (성과80/자기10/부하10)" };
    const SENIOR = { competency: 0.3, performance: 0.6, selfDev: 0.1, mentoring: 0, label: "실·부·차장 (역량30/성과60/자기10)" };
    const MID = { competency: 0.6, performance: 0.4, selfDev: 0, mentoring: 0, label: "과·대리 (역량60/성과40)" };
    const JUNIOR = { competency: 0.7, performance: 0.3, selfDev: 0, mentoring: 0, label: "주·사원 (역량70/성과30)" };

    function weightsFor(position) {
      if (["사장", "부사장", "전무", "상무", "이사"].includes(position)) return EXEC;
      if (["실장", "부장", "차장"].includes(position)) return SENIOR;
      if (["과장", "대리"].includes(position)) return MID;
      return JUNIOR;
    }

    function finalScore(position, ev) {
      const w = weightsFor(position);
      const n = (v) => (v === "" || v === null || isNaN(v) ? 0 : parseFloat(v));
      const sum = (n(ev.competency) * w.competency) +
                  (n(ev.performance) * w.performance) +
                  (n(ev.selfDev) * w.selfDev) +
                  (n(ev.mentoring) * w.mentoring);
      return Math.round((sum + n(ev.adjust)) * 10) / 10;
    }

    function App() {
      const [sbConfig, setSbConfig] = useState(() => ({
        url: localStorage.getItem("ds_sb_url") || "",
        key: localStorage.getItem("ds_sb_key") || ""
      }));
      const [supabaseClient, setSupabaseClient] = useState(null);
      const [isConfigOpen, setIsConfigOpen] = useState(false);
      const [isEmpModalOpen, setIsEmpModalOpen] = useState(false);
      const [isWeightGuideOpen, setIsWeightGuideOpen] = useState(false);
      const [editingEmp, setEditingEmp] = useState(null);

      const [year, setYear] = useState(2025);
      const [dept, setDept] = useState("전체");
      const [tab, setTab] = useState("input");
      const [searchQuery, setSearchQuery] = useState("");

      const [employees, setEmployees] = useState(() => {
        const saved = localStorage.getItem("ds_emp_master_v2");
        return saved ? JSON.parse(saved) : DEFAULT_EMPLOYEES;
      });

      const [evalStore, setEvalStore] = useState(() => {
        const saved = localStorage.getItem("ds_eval_store_v2");
        if (saved) {
          try { return JSON.parse(saved); } catch(e){}
        }
        return { 2025: DEFAULT_SEED_2025 };
      });

      useEffect(() => {
        if (sbConfig.url && sbConfig.key && window.supabase) {
          try {
            setSupabaseClient(window.supabase.createClient(sbConfig.url, sbConfig.key));
          } catch(e) {}
        }
      }, [sbConfig]);

      useEffect(() => {
        if (!supabaseClient) return;

        supabaseClient.from("employees").select("*").eq("is_active", true).order("emp_no").then(({ data, error }) => {
          if (!error && data && data.length > 0) {
            setEmployees(data);
            localStorage.setItem("ds_emp_master_v2", JSON.stringify(data));
          } else if (data && data.length === 0) {
            supabaseClient.from("employees").upsert(DEFAULT_EMPLOYEES).then(() => {});
          }
        });

        supabaseClient.from("annual_evaluations").select("*").eq("eval_year", year).then(({ data, error }) => {
          if (!error && data && data.length > 0) {
            const loaded = {};
            data.forEach(r => {
              loaded[r.emp_no] = {
                competency: r.comp_score !== null ? r.comp_score : "",
                performance: r.perf_score !== null ? r.perf_score : "",
                selfDev: r.self_dev_score !== null ? r.self_dev_score : "",
                mentoring: r.leadership_score !== null ? r.leadership_score : "",
                adjust: r.adj_score !== null ? r.adj_score : "",
                adjustReason: r.adj_reason || "",
                grade: r.final_grade || "",
                note: r.remarks || ""
              };
            });
            setEvalStore(prev => ({ ...prev, [year]: loaded }));
          }
        });
      }, [supabaseClient, year]);

      useEffect(() => {
        localStorage.setItem("ds_emp_master_v2", JSON.stringify(employees));
      }, [employees]);

      useEffect(() => {
        localStorage.setItem("ds_eval_store_v2", JSON.stringify(evalStore));
      }, [evalStore]);

      const filteredEmps = useMemo(() => {
        return employees.filter(e => {
          const matchDept = dept === "전체" || e.dept === dept;
          const matchSearch = searchQuery === "" || 
            (e.name && e.name.includes(searchQuery)) || 
            (e.emp_no && e.emp_no.includes(searchQuery)) || 
            (e.position && e.position.includes(searchQuery));
          return matchDept && matchSearch;
        });
      }, [employees, dept, searchQuery]);

      const currentYearEvals = evalStore[year] || {};
      const counts = useMemo(() => {
        const c = { S: 0, A: 0, B: 0, C: 0, D: 0 };
        filteredEmps.forEach(e => {
          const g = currentYearEvals[e.emp_no]?.grade;
          if (g && c[g] !== undefined) c[g]++;
        });
        return c;
      }, [filteredEmps, currentYearEvals]);

      const totalCount = filteredEmps.length;
      const gradedTotal = GRADES.reduce((s, g) => s + counts[g], 0);
      const getPct = (c) => (totalCount > 0 ? Math.round((c / totalCount) * 1000) / 10 : 0);

      const handleCellChange = (empNo, field, value) => {
        setEvalStore(prev => {
          const yData = prev[year] || {};
          const empEval = yData[empNo] || { competency: "", performance: "", selfDev: "", mentoring: "", adjust: "", adjustReason: "", grade: "", note: "" };
          const updatedEval = { ...empEval, [field]: value };
          return { ...prev, [year]: { ...yData, [empNo]: updatedEval } };
        });
      };

      const handleSaveAll = async () => {
        if (!supabaseClient) {
          alert("Supabase 설정이 등록되지 않아 로컬 브라우저에만 저장되었습니다.");
          return;
        }
        const records = filteredEmps.map(e => {
          const ev = currentYearEvals[e.emp_no] || {};
          return {
            eval_year: year,
            emp_no: e.emp_no,
            comp_score: ev.competency === "" ? null : ev.competency,
            perf_score: ev.performance === "" ? null : ev.performance,
            self_dev_score: ev.selfDev === "" ? null : ev.selfDev,
            leadership_score: ev.mentoring === "" ? null : ev.mentoring,
            adj_score: ev.adjust === "" ? null : ev.adjust,
            adj_reason: ev.adjustReason || null,
            final_score: finalScore(e.position, ev),
            final_grade: ev.grade || null,
            promo_points: pointsFor(ev.grade),
            remarks: ev.note || null
          };
        });

        const { error } = await supabaseClient.from("annual_evaluations").upsert(records, { onConflict: "eval_year,emp_no" });
        if (error) {
          alert("저장 실패: " + error.message);
        } else {
          alert("Supabase에 " + records.length + "명의 데이터가 성공적으로 저장되었습니다.");
        }
      };

      const handleExportCSV = () => {
        let csv = "\uFEFF사번,성명,부서,직위,역량,성과,자기계발,부하육성,가감점,가감사유,최종환산점수,최종등급,승진포인트,특이사항\n";
        filteredEmps.forEach(e => {
          const ev = currentYearEvals[e.emp_no] || {};
          const fScore = finalScore(e.position, ev);

                      h("td", { className: "p-2" },
                        h("input", {
                          type: "text", placeholder: "특이사항 메모", value: ev.note,
                          onChange: e => handleCellChange(emp.emp_no, 'note', e.target.value),
                          className: "w-full border border-slate-200 rounded-lg px-2 py-1 text-xs text-slate-600 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"
                        })
                      )
                    );
                  })
                )
              )
            )
          )
        ) : (
          // 다년도 승진심사 매트릭스 탭
          h("div", { className: "bg-white border border-slate-200/80 rounded-2xl p-6 shadow-sm" },
            h("div", { className: "flex justify-between items-center mb-4" },
              h("div", null,
                h("h2", { className: "text-base font-extrabold text-slate-800 flex items-center gap-2" },
                  h("i", { className: "fa-solid fa-award text-amber-500" }),
                  "다년도 승진심사 매트릭스 (2023년 ~ 2025년 3개년 누적 승진포인트 비교)"
                ),
                h("p", { className: "text-xs text-slate-400 mt-0.5" }, "사번, 성명, 부서, 직위, 최근승진일 및 최근 3개년 등급(포인트)과 누적 승진포인트 합계를 가로 한 줄로 비교 조회합니다.")
              ),
              h("span", { className: "text-xs text-slate-400 font-semibold" }, "S(10점) · A(8점) · B(6점) · C(4점) · D(2점)")
            ),

            h("div", { className: "overflow-x-auto rounded-xl border border-slate-200/80" },
              h("table", { className: "w-full text-left text-xs border-collapse" },
                h("thead", { className: "bg-slate-100 text-slate-700 font-bold border-b" },
                  h("tr", null,
                    h("th", { className: "p-3 text-center w-16" }, "사번"),
                    h("th", { className: "p-3 w-20" }, "성명"),
                    h("th", { className: "p-3 w-24" }, "부서"),
                    h("th", { className: "p-3 w-20" }, "직위"),
                    h("th", { className: "p-3 text-center w-28" }, "최근승진일"),
                    h("th", { className: "p-3 text-center w-36" }, "2023년 등급(포인트)"),
                    h("th", { className: "p-3 text-center w-36" }, "2024년 등급(포인트)"),
                    h("th", { className: "p-3 text-center w-36 bg-blue-50/50" }, "2025년 등급(포인트)"),
                    h("th", { className: "p-3 text-center w-40 font-black text-white bg-[#0b192c]" }, "3개년 누적 승진포인트 합계")
                  )
                ),
                h("tbody", { className: "divide-y divide-slate-100" },
                  filteredEmps.map(emp => {
                    const curGrade = currentYearEvals[emp.emp_no]?.grade || "B";
                    const curPoint = pointsFor(curGrade);
                    // 과거 2개년 데이터 매핑
                    const p2023 = (emp.emp_no === "DS-1001" || emp.emp_no === "DS-2001" || emp.emp_no === "DS-2004") ? 8 : 6;
                    const g2023 = (p2023 === 8) ? "A" : "B";
                    const p2024 = (emp.emp_no === "DS-2001") ? 10 : (emp.emp_no === "DS-1001" || emp.emp_no === "DS-1002" || emp.emp_no === "DS-2004") ? 8 : 6;
                    const g2024 = (p2024 === 10) ? "S" : (p2024 === 8) ? "A" : "B";

                    const totalPoint = p2023 + p2024 + curPoint;

                    return h("tr", { key: emp.emp_no, className: "hover:bg-slate-50 transition" },
                      h("td", { className: "p-3 text-center font-mono text-slate-400 text-[11px]" }, emp.emp_no),
                      h("td", { className: "p-3 font-bold text-slate-800" }, emp.name),
                      h("td", { className: "p-3 text-slate-600 font-medium" }, emp.dept),
                      h("td", { className: "p-3 font-semibold text-slate-700" }, emp.position),
                      h("td", { className: "p-3 text-center text-slate-500 font-mono text-[11px]" }, emp.promo_date || '-'),
                      h("td", { className: "p-3 text-center text-slate-600" }, g2023 + "등급 (" + p2023 + "점)"),
                      h("td", { className: "p-3 text-center text-slate-600" }, g2024 + "등급 (" + p2024 + "점)"),
                      h("td", { className: "p-3 text-center font-bold text-blue-600 bg-blue-50/20" },
                        curGrade ? (curGrade + "등급 (" + curPoint + "점)") : "-"
                      ),
                      h("td", { className: "p-3 text-center font-black text-blue-900 bg-slate-100 text-sm tracking-tight" },
                        totalPoint + "점"
                      )
                    );
                  })
                )
              )
            )
          )
        ),

        // ==========================================
        // 모달 팝업들 (사원 마스터 / 가중치 기준표 / Supabase 설정)
        // ==========================================

        // 1. 사원 마스터 모달
        isEmpModalOpen ? (
          h("div", { className: "fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
            h("div", { className: "bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-200" },
              h("div", { className: "flex justify-between items-center mb-4 pb-2 border-b" },
                h("h3", { className: "font-black text-slate-800 text-base" }, editingEmp ? "사원 정보 수정" : "신규 사원 등록"),
                h("button", { onClick: () => setIsEmpModalOpen(false), className: "text-slate-400 hover:text-slate-600" },
                  h("i", { className: "fa-solid fa-xmark text-lg" })
                )
              ),
              h("form", {
                onSubmit: (e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  handleSaveEmployee({
                    emp_no: fd.get("emp_no"),
                    name: fd.get("name"),
                    dept: fd.get("dept"),
                    position: fd.get("position"),
                    birth_date: fd.get("birth_date") || null,
                    hire_date: fd.get("hire_date") || null,
                    promo_date: fd.get("promo_date") || null,
                    is_active: true
                  });
                },
                className: "space-y-3.5 text-xs"
              },
                h("div", null,
                  h("label", { className: "block text-slate-600 font-bold mb-1" }, "사번"),
                  h("input", {
                    name: "emp_no", defaultValue: editingEmp ? editingEmp.emp_no : "",
                    readOnly: Boolean(editingEmp), required: true, placeholder: "예: DS-1005",
                    className: "w-full border rounded-xl px-3 py-2 font-mono bg-slate-50 focus:outline-blue-500 font-bold"
                  })
                ),
                h("div", null,
                  h("label", { className: "block text-slate-600 font-bold mb-1" }, "성명"),
                  h("input", {
                    name: "name", defaultValue: editingEmp ? editingEmp.name : "",
                    required: true, placeholder: "성명 입력",
                    className: "w-full border rounded-xl px-3 py-2 font-semibold focus:outline-blue-500"
                  })
                ),
                h("div", { className: "grid grid-cols-2 gap-2" },
                  h("div", null,
                    h("label", { className: "block text-slate-600 font-bold mb-1" }, "부서"),
                    h("select", { name: "dept", defaultValue: editingEmp ? editingEmp.dept : "관리팀", className: "w-full border rounded-xl px-2.5 py-2 focus:outline-blue-500 font-medium" },
                      DEPARTMENTS.map(d => h("option", { key: d, value: d }, d))
                    )
                  ),
                  h("div", null,
                    h("label", { className: "block text-slate-600 font-bold mb-1" }, "직위"),
                    h("select", { name: "position", defaultValue: editingEmp ? editingEmp.position : "사원", className: "w-full border rounded-xl px-2.5 py-2 focus:outline-blue-500 font-medium" },
                      POSITIONS.map(p => h("option", { key: p, value: p }, p))
                    )
                  )
                ),
                h("div", { className: "grid grid-cols-3 gap-2" },
                  h("div", null,
                    h("label", { className: "block text-slate-600 font-medium mb-1" }, "생년월일"),
                    h("input", { type: "date", name: "birth_date", defaultValue: editingEmp ? editingEmp.birth_date : "", className: "w-full border rounded-xl px-2 py-1.5 text-[11px]" })
                  ),
                  h("div", null,
                    h("label", { className: "block text-slate-600 font-medium mb-1" }, "입사일자"),
                    h("input", { type: "date", name: "hire_date", defaultValue: editingEmp ? editingEmp.hire_date : "", className: "w-full border rounded-xl px-2 py-1.5 text-[11px]" })
                  ),
                  h("div", null,
                    h("label", { className: "block text-slate-600 font-medium mb-1" }, "최근승진일"),
                    h("input", { type: "date", name: "promo_date", defaultValue: editingEmp ? editingEmp.promo_date : "", className: "w-full border rounded-xl px-2 py-1.5 text-[11px]" })
                  )
                ),
                h("div", { className: "flex justify-end gap-2 pt-4 border-t mt-4" },
                  h("button", {
                    type: "button", onClick: () => setIsEmpModalOpen(false),
                    className: "px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold"
                  }, "취소"),
                  h("button", {
                    type: "submit",
                    className: "px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-extrabold shadow-md"
                  }, "저장하기")
                )
              )
            )
          )
        ) : null,

        // 2. 직급별 가중치 산출기준표 팝업
        isWeightGuideOpen ? (
          h("div", { className: "fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
            h("div", { className: "bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-200" },
              h("div", { className: "flex justify-between items-center mb-4 pb-2 border-b" },
                h("h3", { className: "font-black text-slate-800 text-base flex items-center gap-2" },
                  h("i", { className: "fa-solid fa-scale-balanced text-blue-600" }),
                  "직급별 평가항목 가중치 산출기준표"
                ),
                h("button", { onClick: () => setIsWeightGuideOpen(false), className: "text-slate-400 hover:text-slate-600" },
                  h("i", { className: "fa-solid fa-xmark text-lg" })
                )
              ),
              h("div", { className: "space-y-4 text-xs text-slate-600" },
                h("table", { className: "w-full border-collapse text-center" },
                  h("thead", { className: "bg-slate-100 text-slate-700 font-bold" },
                    h("tr", null,
                      h("th", { className: "p-2.5 border" }, "구분"),
                      h("th", { className: "p-2.5 border" }, "역량"),
                      h("th", { className: "p-2.5 border" }, "성과"),
                      h("th", { className: "p-2.5 border" }, "자기계발"),
                      h("th", { className: "p-2.5 border" }, "부하육성")
                    )
                  ),
                  h("tbody", null,
                    h("tr", null,
                      h("td", { className: "p-2.5 border font-bold bg-slate-50" }, "임원진"),
                      h("td", { className: "p-2.5 border text-slate-300" }, "-"),
                      h("td", { className: "p-2.5 border font-bold text-blue-600" }, "80%"),
                      h("td", { className: "p-2.5 border" }, "10%"),
                      h("td", { className: "p-2.5 border" }, "10%")
                    ),
                    h("tr", null,
                      h("td", { className: "p-2.5 border font-bold bg-slate-50" }, "실장 · 부장 · 차장"),
                      h("td", { className: "p-2.5 border font-bold" }, "30%"),
                      h("td", { className: "p-2.5 border font-bold text-blue-600" }, "60%"),
                      h("td", { className: "p-2.5 border" }, "10%"),
                      h("td", { className: "p-2.5 border text-slate-300" }, "-")
                    ),
                    h("tr", null,
                      h("td", { className: "p-2.5 border font-bold bg-slate-50" }, "과장 · 대리"),
                      h("td", { className: "p-2.5 border font-bold text-blue-600" }, "60%"),
                      h("td", { className: "p-2.5 border font-bold" }, "40%"),
                      h("td", { className: "p-2.5 border text-slate-300" }, "-"),
                      h("td", { className: "p-2.5 border text-slate-300" }, "-")
                    ),
                    h("tr", null,
                      h("td", { className: "p-2.5 border font-bold bg-slate-50" }, "주임 · 사원"),
                      h("td", { className: "p-2.5 border font-bold text-blue-600" }, "70%"),
                      h("td", { className: "p-2.5 border font-bold" }, "30%"),
                      h("td", { className: "p-2.5 border text-slate-300" }, "-"),
                      h("td", { className: "p-2.5 border text-slate-300" }, "-")
                    )
                  )
                ),
                h("div", { className: "bg-slate-50 p-3 rounded-xl border text-[11px] space-y-1 text-slate-500" },
                  h("p", null, "• 최종 환산점수 = Σ(원점수 × 직급별 가중치) ± 가감점 (소수점 첫째 자리 반올림)"),
                  h("p", null, "• 그룹 평가 기준율: S(5%), A(15%), B(65%), C(10%), D(5%)")
                )
              ),
              h("div", { className: "flex justify-end pt-4 border-t mt-4" },
                h("button", { onClick: () => setIsWeightGuideOpen(false), className: "px-4 py-2 rounded-xl bg-slate-900 text-white font-bold" }, "확인 닫기")
              )
            )
          )
        ) : null,

        // 3. Supabase 설정 모달
        isConfigOpen ? (
          h("div", { className: "fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
            h("div", { className: "bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-200" },
              h("h3", { className: "font-black text-slate-800 text-base mb-3 pb-2 border-b flex items-center gap-2" },
                h("i", { className: "fa-solid fa-cloud text-blue-600" }),
                "Supabase 클라우드 설정"
              ),
              h("div", { className: "space-y-3.5 text-xs" },
                h("div", null,
                  h("label", { className: "block text-slate-600 font-bold mb-1" }, "Project URL"),
                  h("input", {
                    type: "text", id: "sb_url_input", defaultValue: sbConfig.url,
                    placeholder: "https://xxxxxxxx.supabase.co",
                    className: "w-full border rounded-xl px-3 py-2 font-mono"
                  })
                ),
                h("div", null,
                  h("label", { className: "block text-slate-600 font-bold mb-1" }, "Anon / Public API Key"),
                  h("textarea", {
                    id: "sb_key_input", defaultValue: sbConfig.key, rows: 3,
                    placeholder: "eyJh...",
                    className: "w-full border rounded-xl px-3 py-2 font-mono"
                  })
                )
              ),
              h("div", { className: "flex justify-end gap-2 pt-4 border-t mt-4" },
                h("button", { onClick: () => setIsConfigOpen(false), className: "px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs" }, "닫기"),
                h("button", {
                  onClick: () => {
                    const u = document.getElementById("sb_url_input").value.trim();
                    const k = document.getElementById("sb_key_input").value.trim();
                    localStorage.setItem("ds_sb_url", u);
                    localStorage.setItem("ds_sb_key", k);
                    setSbConfig({ url: u, key: k });
                    setIsConfigOpen(false);
                    alert("Supabase 연결 정보가 등록되었습니다.");
                  },
                  className: "px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs shadow-md"
                }, "설정 저장")
              )
            )
          )
        ) : null
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
