    // - 실장 / 부장 / 차장: 역량 30%, 성과 60%, 자기계발 10% (부하육성 0%)
    // - 과장 / 대리: 역량 60%, 성과 40% (자기계발 0%, 부하육성 0%)
    // - 주임 / 사원: 역량 70%, 성과 30% (자기계발 0%, 부하육성 0%)
    function getWeightsByPosition(position) {
      switch (position) {
        case '사장':
        case '부사장':
        case '전무':
        case '상무':
        case '이사':
          return { groupName: '임원진', competency: 0, performance: 0.8, selfDev: 0.1, subordinateDev: 0.1 };
        case '실장':
        case '부장':
        case '차장':
          return { groupName: '실장/부장/차장', competency: 0.3, performance: 0.6, selfDev: 0.1, subordinateDev: 0 };
        case '과장':
        case '대리':
          return { groupName: '과장/대리', competency: 0.6, performance: 0.4, selfDev: 0, subordinateDev: 0 };
        case '주임':
        case '사원':
        default:
          return { groupName: '주임/사원', competency: 0.7, performance: 0.3, selfDev: 0, subordinateDev: 0 };
      }
    }

    function calculateFinalScore(position, competency, performance, selfDev, subordinateDev, bonusPenalty) {
      const weights = getWeightsByPosition(position);
      const compVal = weights.competency > 0 ? Number(competency || 0) : 0;
      const perfVal = weights.performance > 0 ? Number(performance || 0) : 0;
      const selfVal = weights.selfDev > 0 ? Number(selfDev || 0) : 0;
      const subVal = weights.subordinateDev > 0 ? Number(subordinateDev || 0) : 0;
      const bonusVal = Number(bonusPenalty || 0);

      const rawTotal =
        compVal * weights.competency +
        perfVal * weights.performance +
        selfVal * weights.selfDev +
        subVal * weights.subordinateDev +
        bonusVal;

      return Math.round(rawTotal * 10) / 10;
    }

    function makeEval(eval_year, emp, comp, perf, selfDev, subDev, bonus, reason, grade, remarks) {

      const c = weights.competency > 0 ? comp : null;
      const p = weights.performance > 0 ? perf : null;
      const s = weights.selfDev > 0 ? selfDev : null;
      const sub = weights.subordinateDev > 0 ? subDev : null;
      const finalScore = calculateFinalScore(emp.position, c, p, s, sub, bonus);
      return {
        eval_year,
        emp_no: emp.emp_no,
        competency_score: c,
        performance_score: p,
        self_dev_score: s,
        subordinate_dev_score: sub,
        bonus_penalty_score: bonus,
        bonus_penalty_reason: reason,
        final_score: finalScore,
        final_grade: grade,
        promotion_points: GRADE_POINTS[grade] || 0,

      const map2023 = {};
      const map2024 = {};
      const map2025 = {};

      for (const emp of INITIAL_EMPLOYEES) {
        const g23 = grades2023[emp.emp_no];
        map2023[emp.emp_no] = makeEval(2023, emp, g23.comp, g23.perf, g23.self, null, g23.bonus, g23.reason, g23.grade, g23.remarks);
        const g24 = grades2024[emp.emp_no];
        map2024[emp.emp_no] = makeEval(2024, emp, g24.comp, g24.perf, g24.self, null, g24.bonus, g24.reason, g24.grade, g24.remarks);
      }
      for (const rec of data2025) {
        map2025[rec.emp_no] = rec;
      }

      return { 2023: map2023, 2024: map2024, 2025: map2025 };
    }

    const STORAGE_KEY = 'daesung_steel_hr_evaluations_v1';
    const SUPABASE_CONFIG_KEY = 'daesung_steel_supabase_config_v1';
    const DEPARTMENTS = ['전체 부서', '관리팀', '영업팀', '생산관리팀', '생산팀'];

    function StandaloneApp() {
      const [evalYear, setEvalYear] = useState(2025);
      const [selectedDept, setSelectedDept] = useState('전체 부서');
      const [activeTab, setActiveTab] = useState('input'); // 'input' | 'matrix'
      const [searchQuery, setSearchQuery] = useState('');
      const [showWeightGuide, setShowWeightGuide] = useState(false);
      const [showDbModal, setShowDbModal] = useState(false);
      const [syncNotice, setSyncNotice] = useState('');

      const [sbConfig, setSbConfig] = useState(() => {
        try {
          const saved = localStorage.getItem(SUPABASE_CONFIG_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            return {
              url: parsed.url || SUPABASE_URL,
              anonKey: parsed.anonKey || SUPABASE_ANON_KEY,
            };
          }
        } catch (e) {}
        return { url: SUPABASE_URL, anonKey: SUPABASE_ANON_KEY };
      });

      const [evaluationsByYear, setEvaluationsByYear] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            return JSON.parse(raw);
          }
        } catch (e) {}
        return buildInitialEvaluations();
      });

      const supabaseClient = useMemo(() => {
        if (sbConfig.url && sbConfig.anonKey && window.supabase) {
          try {
            return window.supabase.createClient(sbConfig.url, sbConfig.anonKey);
          } catch (e) {
            return null;
          }
        }
        return null;
      }, [sbConfig.url, sbConfig.anonKey]);

      // localStorage 자동 저장
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(evaluationsByYear));
        } catch (e) {}
      }, [evaluationsByYear]);

      // Supabase 초기 데이터 로드 (설정된 경우)
      useEffect(() => {
        if (!supabaseClient) return;
        let cancelled = false;
        (async () => {
          try {
            const { data, error } = await supabaseClient
              .from('annual_evaluations')
              .select('*');
            if (!error && data && data.length > 0 && !cancelled) {
              setEvaluationsByYear((prev) => {
                const next = { ...prev };
                for (const row of data) {
                  const y = Number(row.eval_year);
                  if (!next[y]) next[y] = {};
                  next[y][row.emp_no] = {
                    eval_year: y,
                    emp_no: row.emp_no,
                    competency_score: row.competency_score !== null ? Number(row.competency_score) : null,
                    performance_score: row.performance_score !== null ? Number(row.performance_score) : null,
                    self_dev_score: row.self_dev_score !== null ? Number(row.self_dev_score) : null,
                    subordinate_dev_score: row.subordinate_dev_score !== null ? Number(row.subordinate_dev_score) : null,
                    bonus_penalty_score: Number(row.bonus_penalty_score || 0),
                    bonus_penalty_reason: row.bonus_penalty_reason || '',
                    final_score: Number(row.final_score || 0),
                    final_grade: row.final_grade || '',
                    promotion_points: Number(row.promotion_points || 0),
                    remarks: row.remarks || '',
                  };
                }
                return next;
              });
              setSyncNotice('Supabase DB 동기화 완료');
              setTimeout(() => setSyncNotice(''), 3000);
            }
          } catch (err) {}
        })();
        return () => { cancelled = true; };
      }, [supabaseClient]);

      const ensureYearData = useCallback((year) => {
        if (evaluationsByYear[year]) return evaluationsByYear[year];
        const map = {};
        for (const emp of INITIAL_EMPLOYEES) {
          const weights = getWeightsByPosition(emp.position);
          map[emp.emp_no] = {
            eval_year: year,
            emp_no: emp.emp_no,
            competency_score: weights.competency > 0 ? 80 : null,
            performance_score: weights.performance > 0 ? 80 : null,
            self_dev_score: weights.selfDev > 0 ? 80 : null,
            subordinate_dev_score: weights.subordinateDev > 0 ? 80 : null,
            bonus_penalty_score: 0,
            bonus_penalty_reason: '',
            final_score: calculateFinalScore(emp.position, 80, 80, 80, 80, 0),
            final_grade: 'B',
            promotion_points: 6,
            remarks: '',
          };
        }
        return map;
      }, [evaluationsByYear]);

      const currentYearMap = useMemo(() => ensureYearData(evalYear), [ensureYearData, evalYear]);

      const upsertToSupabase = useCallback(async (record) => {
        if (!supabaseClient) return;
        try {
          await supabaseClient.from('annual_evaluations').upsert(
            {
              eval_year: record.eval_year,
              emp_no: record.emp_no,
              competency_score: record.competency_score,
              performance_score: record.performance_score,
              self_dev_score: record.self_dev_score,
              subordinate_dev_score: record.subordinate_dev_score,
              bonus_penalty_score: record.bonus_penalty_score,
              bonus_penalty_reason: record.bonus_penalty_reason,
              final_score: record.final_score,
              final_grade: record.final_grade,
              promotion_points: record.promotion_points,
              remarks: record.remarks,
              updated_at: new Date().toISOString(),
            },
            { onConflict: 'eval_year,emp_no' }
          );
        } catch (e) {}
      }, [supabaseClient]);

      const handleUpdateRecord = useCallback((emp, patch) => {
        setEvaluationsByYear((prev) => {
          const yearMap = { ...(prev[evalYear] || ensureYearData(evalYear)) };
          const existing = yearMap[emp.emp_no];
          const updated = { ...existing, ...patch };
          updated.final_score = calculateFinalScore(
            emp.position,
            updated.competency_score,
            updated.performance_score,
            updated.self_dev_score,
            updated.subordinate_dev_score,
            updated.bonus_penalty_score
          );
          updated.promotion_points = GRADE_POINTS[updated.final_grade] || 0;
          yearMap[emp.emp_no] = updated;
          upsertToSupabase(updated);
          return { ...prev, [evalYear]: yearMap };
        });
      }, [evalYear, ensureYearData, upsertToSupabase]);

      const filteredEmployees = useMemo(() => {
        return INITIAL_EMPLOYEES.filter((emp) => {
          const matchDept = selectedDept === '전체 부서' || emp.dept === selectedDept;
          const q = searchQuery.trim().toLowerCase();
          const matchQuery = !q || emp.name.toLowerCase().includes(q) || emp.emp_no.toLowerCase().includes(q) || emp.position.toLowerCase().includes(q);
          return matchDept && matchQuery;
        });
      }, [selectedDept, searchQuery]);

      // 대시보드 집계 (현재 필터링된 대상 인원 기준)
      const dashboardStats = useMemo(() => {
        const targetCount = filteredEmployees.length;
        const counts = { S: 0, A: 0, B: 0, C: 0, D: 0 };
        let assignedCount = 0;

        for (const emp of filteredEmployees) {
          const rec = currentYearMap[emp.emp_no];
          if (rec && rec.final_grade && counts[rec.final_grade] !== undefined) {
            counts[rec.final_grade] += 1;
            assignedCount += 1;
          }
        }

        const assignedRate = targetCount > 0 ? ((assignedCount / targetCount) * 100).toFixed(1) : '0.0';
        const cards = GRADE_RATIOS.map((g) => {
          const currentCount = counts[g.grade];
          const currentRatio = targetCount > 0 ? ((currentCount / targetCount) * 100).toFixed(1) : '0.0';
          const recommendedExact = (targetCount * g.ratio).toFixed(1);
          const recommendedRounded = Math.round(targetCount * g.ratio);
          const isExceeded = currentCount > recommendedRounded;
          return {
            ...g,
            currentCount,
            currentRatio,
            recommendedExact,
            recommendedRounded,
            isExceeded,
          };
        });

        return { targetCount, assignedCount, assignedRate, cards };
      }, [filteredEmployees, currentYearMap]);

      const handleSyncAllToSupabase = async () => {
        if (!supabaseClient) {
          setShowDbModal(true);
          return;
        }
        const rows = Object.values(currentYearMap);
        const { error } = await supabaseClient.from('annual_evaluations').upsert(rows, { onConflict: 'eval_year,emp_no' });
        if (!error) {
          setSyncNotice(evalYear + '년 평가 데이터 ' + rows.length + '건 Supabase 저장 완료');
          setTimeout(() => setSyncNotice(''), 3000);
        } else {
          setSyncNotice('Supabase 저장 오류: ' + error.message);
          setTimeout(() => setSyncNotice(''), 4000);
        }
      };

      const handleResetData = () => {
        const initial = buildInitialEvaluations();
        setEvaluationsByYear(initial);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
        setSyncNotice('초기 실무 데이터(28명)로 복원되었습니다.');
        setTimeout(() => setSyncNotice(''), 3000);

      return (

            {/* 직급별 가중치 및 승진 포인트 안내 패널 */}
            {showWeightGuide && (

                </div>
                <p className="text-xs text-slate-600 leading-relaxed">
                  코드 상단의 <code className="font-mono bg-slate-100 px-1 py-0.5 rounded">SUPABASE_URL</code> 및 <code className="font-mono bg-slate-100 px-1 py-0.5 rounded">SUPABASE_ANON_KEY</code> 상수 또는 아래 입력란에 정보를 입력하면 <code className="font-mono bg-slate-100 px-1 py-0.5 rounded">annual_evaluations</code> 테이블에 실시간 Upsert됩니다. 비어있어도 브라우저 <code className="font-mono bg-slate-100 px-1 py-0.5 rounded">localStorage</code>에 자동 보존됩니다.
                </p>
                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">SUPABASE_URL</label>
                    <input
                      type="text"
                      value={sbConfig.url}
                      onChange={(e) => setSbConfig((s) => ({ ...s, url: e.target.value }))}
                      placeholder="https://your-project.supabase.co"
                      className="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg font-mono"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">SUPABASE_ANON_KEY</label>
                    <input
                      type="password"
                      value={sbConfig.anonKey}
                      onChange={(e) => setSbConfig((s) => ({ ...s, anonKey: e.target.value }))}
                      placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..."
                      className="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg font-mono"
                    />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => {
                      localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify(sbConfig));
                      setShowDbModal(false);
                      setSyncNotice('데이터베이스 연결 설정이 저장되었습니다.');
                      setTimeout(() => setSyncNotice(''), 3000);
                    }}
                    className="px-4 py-2 text-xs font-semibold bg-slate-900 text-white rounded-lg hover:bg-slate-800"
                  >
                    설정 저장
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    if (!window.__VITE_MOUNTED__) {
      const rootEl = document.getElementById('root');
      if (rootEl) {
        const root = ReactDOM.createRoot(rootEl);
        root.render(<StandaloneApp />);
      }
    }
  </script>
</body>
</html>
