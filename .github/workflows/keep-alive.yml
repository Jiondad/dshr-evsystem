name: Keep Supabase Alive

on:
  schedule:
    # 4일마다 한국시간 오전 9시(UTC 00:00)에 자동 실행
    - cron: '0 0 */4 * *'
  # 필요시 GitHub Actions 탭에서 수동 실행(테스트) 가능
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send REST API Ping to Supabase
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/employee_snapshots?select=emp_no&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "Supabase 응답 코드: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Supabase 호출 실패!"
            exit 1
          fi
